[project]
name = "evaljev"
version = "0.1.0"
description = "Independent eval of TypeSafe Jev vs any OpenRouter model"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
laya = [
    "laya>=0.3.4",
    "torch>=2.0",
    "transformers>=4.45",
]

[dependency-groups]
dev = ["pytest>=8"]
build = ["datasets>=3.0"]

[tool.setuptools]
packages = ["evaljev"]

[tool.pytest.ini_options]
pythonpath = ["."]
